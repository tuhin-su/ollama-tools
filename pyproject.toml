[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-tools"
version = "0.1.0"
description = "Comprehensive toolkit for exporting, importing, and migrating Ollama models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ollama Tools Contributors" }]
keywords = ["ollama", "llm", "gguf", "export", "import", "model-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ollama-tools = "ollama_tools.cli:main"
ollama-export = "ollama_tools.cli:main_export"
ollama-import = "ollama_tools.cli:main_import"
